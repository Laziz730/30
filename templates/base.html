<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Uzef Pageshop — E'lonlar{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <div class="wrap head-inner">
      <a href="/" class="logo">🛍️ Uzef Pageshop</a>
      <nav>
        <a href="/">E'lonlar</a>
        <a href="/post" class="btn">➕ E'lon berish</a>
        <a href="/admin">Admin</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% if msgs %}
        {% for cat, m in msgs %}
          <div class="flash {{ cat }}">{{ m }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <footer>
    <div class="wrap">
      📞 @uzefpageshop • @uzefpage • @uzefpagecoins
    </div>
  </footer>
</body>
</html>
